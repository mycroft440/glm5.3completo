name: GLM 5.3 complete server CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax
        run: bash -n install.sh manage.sh info healthcheck.sh test-api.sh scripts/*.sh

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh manage.sh info healthcheck.sh test-api.sh scripts/*.sh

      - name: GLM frontend patch self-test
        run: python3 scripts/patch_vllm_agent_compat.py --self-test

      - name: Spot watcher self-test
        run: bash scripts/spot-watch.sh --self-test

      - name: Render ROCm profile and preserve tuning
        run: |
          cp .env.example .env
          sed -i 's/^API_KEY=.*/API_KEY=ci-test-key/' .env
          ENV_FILE="$PWD/.env" bash scripts/apply-profile.sh rocm
          grep -F 'ACCELERATOR_PROFILE=rocm' .env
          grep -F 'VLLM_BASE_IMAGE=vllm/vllm-openai-rocm@sha256:e0a3b2bd3fe7ec563916c3a5d949898d133458c18d6b2f460c906885cfb32032' .env
          grep -F 'MAX_MODEL_LEN=524288' .env
          grep -F 'MAX_NUM_SEQS=32' .env
          grep -F 'KV_CACHE_DTYPE=fp8_e4m3' .env
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.rocm.yml config > /tmp/rocm.yml
          grep -F -- '/dev/kfd' /tmp/rocm.yml
          grep -F -- 'VLLM_ROCM_USE_AITER' /tmp/rocm.yml
          grep -F -- '--linear-backend' /tmp/rocm.yml
          grep -F -- '--moe-backend' /tmp/rocm.yml
          grep -F -- '524288' /tmp/rocm.yml
          grep -F -- 'fp8_e4m3' /tmp/rocm.yml
          grep -F -- 'num_speculative_tokens' /tmp/rocm.yml

          sed -i 's/^MAX_MODEL_LEN=.*/MAX_MODEL_LEN=400000/' .env
          sed -i 's/^MAX_NUM_SEQS=.*/MAX_NUM_SEQS=20/' .env
          sed -i 's/^GPU_MEMORY_UTILIZATION=.*/GPU_MEMORY_UTILIZATION=0.76/' .env
          ENV_FILE="$PWD/.env" bash scripts/apply-profile.sh rocm
          grep -F 'MAX_MODEL_LEN=400000' .env
          grep -F 'MAX_NUM_SEQS=20' .env
          grep -F 'GPU_MEMORY_UTILIZATION=0.76' .env

          ENV_FILE="$PWD/.env" bash scripts/apply-profile.sh nvidia
          grep -F 'MAX_MODEL_LEN=131072' .env
          grep -F 'MAX_NUM_SEQS=8' .env
          grep -F 'GPU_MEMORY_UTILIZATION=0.90' .env

      - name: Render NVIDIA profile
        run: |
          cp .env.example .env
          sed -i 's/^API_KEY=.*/API_KEY=ci-test-key/' .env
          ENV_FILE="$PWD/.env" bash scripts/apply-profile.sh nvidia
          grep -F 'ACCELERATOR_PROFILE=nvidia' .env
          grep -F 'MAX_MODEL_LEN=131072' .env
          grep -F 'MAX_NUM_BATCHED_TOKENS=8192' .env
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.nvidia.yml config > /tmp/nvidia.yml
          grep -F -- 'driver: nvidia' /tmp/nvidia.yml
          grep -F -- 'DG_JIT_CACHE_DIR' /tmp/nvidia.yml
          grep -F -- '--max-num-batched-tokens' /tmp/nvidia.yml
          grep -F -- '8192' /tmp/nvidia.yml
          grep -F -- 'fp8' /tmp/nvidia.yml

      - name: Reproducibility pins
        run: |
          grep -F -- 'sha256:e0a3b2bd3fe7ec563916c3a5d949898d133458c18d6b2f460c906885cfb32032' .env.example Dockerfile.rocm scripts/apply-profile.sh
          grep -F -- 'sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635' .env.example Dockerfile scripts/apply-profile.sh
          grep -F -- 'aca966e4e02791568aa6a4ced368624b3d897f42' .env.example install.sh
          grep -F -- '8b1392b978f5a03c828dd1711090d7fb50958b8a' Dockerfile
          grep -F -- 'patch_vllm_agent_compat.py' Dockerfile Dockerfile.rocm
          if grep -R -Fq -- 'privileged: true' docker-compose*.yml; then
            echo 'Runtime must not use privileged: true' >&2
            exit 1
          fi

      - name: Dockerfile build checks
        run: |
          docker buildx build --check \
            --build-arg 'VLLM_BASE_IMAGE=vllm/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635' \
            -f Dockerfile .
          docker buildx build --check \
            --build-arg 'VLLM_BASE_IMAGE=vllm/vllm-openai-rocm@sha256:e0a3b2bd3fe7ec563916c3a5d949898d133458c18d6b2f460c906885cfb32032' \
            -f Dockerfile.rocm .

      - name: Build ROCm runtime image for real
        if: github.event_name != 'pull_request'
        timeout-minutes: 45
        run: |
          docker build \
            --build-arg 'VLLM_BASE_IMAGE=vllm/vllm-openai-rocm@sha256:e0a3b2bd3fe7ec563916c3a5d949898d133458c18d6b2f460c906885cfb32032' \
            -f Dockerfile.rocm \
            -t glm53-ci-rocm .
          docker run --rm --entrypoint python3 glm53-ci-rocm -c "import importlib.util,torch,vllm; assert torch.version.hip; assert importlib.util.find_spec('aiter') is not None; print(torch.version.hip, vllm.__version__, 'AITER package present')"

      - name: Storage and XGMI guards
        run: |
          grep -F -- 'REQUIRE_SEPARATE_MODEL_FILESYSTEM=1' .env.example
          grep -F -- 'REJECT_AZURE_LOCAL_MODEL_STORAGE=1' .env.example
          grep -F -- 'xgmi_hive_id' scripts/preflight.sh
          grep -F -- '--showtopotype' scripts/preflight.sh
          grep -F -- 'Microsoft NVMe Direct Disk' scripts/preflight.sh
          grep -F -- 'lsblk -srno PATH' scripts/preflight.sh
          grep -F -- 'RAID/LVM' scripts/preflight.sh
          grep -F -- 'Managed Disk persistente' scripts/preflight.sh

      - name: Global launchers and snapshot guards
        run: |
          test -x info
          grep -F -- 'INSTALL_DIR="${GLM_INSTALL_DIR:-/opt/glm53-complete}"' install.sh
          grep -F -- 'cat >/usr/local/bin/glm-manage' install.sh
          grep -F -- 'ExecStart=${INSTALL_DIR}/scripts/spot-watch.sh' install.sh
          grep -F -- 'name: glm53-complete' docker-compose.yml
          grep -F -- 'compose()' scripts/lib.sh

      - name: Smoke-test coverage guards
        run: |
          grep -F -- 'GLM MAX OK' test-api.sh
          grep -F -- 'GLM_MAX_REASONING_OK' test-api.sh
          grep -F -- 'RESPONSES_OK' test-api.sh
          grep -F -- '/v1/responses' test-api.sh
          grep -F -- 'TOOL_LOOP_OK' test-api.sh
          grep -F -- 'content:null' test-api.sh
          grep -F -- 'enable_thinking:false' test-api.sh
          grep -F -- 'stream:true' test-api.sh
          grep -F -- '[DONE]' test-api.sh
          grep -F -- '--deep' healthcheck.sh manage.sh

      - name: Nginx syntax
        run: |
          nginx_image="$(grep '^NGINX_IMAGE=' .env.example | cut -d= -f2-)"
          docker run --rm \
            --add-host vllm:127.0.0.1 \
            -v "$PWD/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            "$nginx_image" nginx -t
