services:
  vllm:
    environment:
      VLLM_ENABLE_CUDA_COMPATIBILITY: "${VLLM_ENABLE_CUDA_COMPATIBILITY:-0}"
      DG_JIT_CACHE_DIR: /root/.cache/deepgemm
    volumes:
      - "${DEEPGEMM_CACHE_DIR:-/var/lib/glm53-full/deepgemm-cache}:/root/.cache/deepgemm"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "${MODEL_ID:-zai-org/GLM-5.3}"
      - --revision
      - "${MODEL_REVISION}"
      - --tokenizer-revision
      - "${MODEL_REVISION}"
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-8}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-131072}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-8192}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - --kv-cache-dtype
      - "${KV_CACHE_DTYPE:-fp8}"
      - --speculative-config
      - "{\"method\":\"mtp\",\"num_speculative_tokens\":${MTP_SPECULATIVE_TOKENS:-5}}"
      - --tool-call-parser
      - glm47
      - --enable-auto-tool-choice
      - --reasoning-parser
      - glm45
      - --served-model-name
      - "${SERVED_MODEL_NAME:-glm-5.3}"
      - --allowed-media-domains
      - "${ALLOWED_MEDIA_DOMAIN:-media.invalid}"
